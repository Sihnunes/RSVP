<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #F1F0EC;
    --card: #ffffff;
    --rose: #DBA9B7;
    --rose-hover: #ba909c;
    --rose-soft: rgba(219, 169, 183, 0.14);
    --deep: #514846;
    --muted: #756B68;
    --border: rgba(219, 169, 183, 0.28);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { background: var(--bg); }
  body {
    font-family: 'Jost', sans-serif;
    color: var(--deep);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  .hidden { display: none !important; }

  /* ========== LOGIN ========== */
  #login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: calc(2rem + var(--safe-top)) 1.5rem calc(2rem + var(--safe-bottom));
    max-width: 420px;
    margin: 0 auto;
  }
  .eyebrow {
    font-size: 0.62rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--rose);
    display: block;
    text-align: center;
    margin-bottom: 0.6rem;
  }
  .login-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 2.4rem;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 2rem;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2rem 1.5rem;
  }
  .field-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  .input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    padding: 13px 14px;
    font-family: 'Jost', sans-serif;
    font-size: 16px;
    font-weight: 300;
    color: var(--deep);
    outline: none;
    -webkit-appearance: none;
  }
  .input:focus { border-color: var(--rose); }
  .btn {
    width: 100%;
    margin-top: 1.25rem;
    padding: 15px;
    border: none;
    border-radius: 4px;
    background: var(--rose);
    color: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

<script>
// Mesma planilha / Apps Script do formulário de confirmação
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx8r3FpTVzNvNPQPWDdmN49wN3KbdNUseoymBFxRDI8_XO1C61OYgen-oTY8Q939iB_zA/exec';
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDGdtEv4fpAQqs2elUMdu1m2w_gSUbt37WkA7_-BSGFrwqP3DLZ9cMtdUaUel8DNPIW11Z-oJ9JqGE/pub?gid=0&single=true&output=csv';

let guests = [];        // [{ name, companions:[{name, child}], status, conf }]
let confirmations = []; // linhas da aba de confirmações
let loadError = '';
let guestFilter = 'todos';
let confFilter = 'confirmado';

const $ = id => document.getElementById(id);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- DADOS ---------- */
// Tempo-limite sem AbortSignal (compatível com pré-visualizações e qualquer navegador)
function fetchTimeout(url, ms = 15000) {
  let t;
  const timeout = new Promise((_, rej) => {
    t = setTimeout(() => { const e = new Error('timeout'); e.name = 'AbortError'; rej(e); }, ms);
  });
  return Promise.race([fetch(url), timeout]).finally(() => clearTimeout(t));
}

function buildGuests(raw) {
  const map = {};
  raw.forEach(g => { if (!g.parent) map[norm(g.name)] = { name: String(g.name).trim(), companions: [] }; });
  raw.forEach(g => {
    if (g.parent) {
      const k = norm(g.parent);
      if (map[k]) map[k].companions.push({ name: String(g.name).trim(), child: !!g.child });
    }
  });
  return Object.values(map);
}

async function fetchGuestsCSV() {
  const r = await fetchTimeout(CSV_URL + '&t=' + Date.now());
  const lines = (await r.text()).trim().split('\n').slice(1);
  const raw = lines.filter(l => l.trim()).map(l => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < l.length; i++) {
      if (l[i] === '"') inQ = !inQ;
      else if (l[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += l[i];
    }
    cols.push(cur.trim());
    return { name: cols[0] || '', parent: (cols[1] || '').trim(), child: norm(cols[2]).startsWith('sim') };
  }).filter(g => g.name);
  return buildGuests(raw);
}

async function loadData() {
  loadError = '';
  let rawGuests = null;
  try {
    const r = await fetchTimeout(SHEET_URL + '?action=bootstrap&t=' + Date.now());
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); }
    catch(_) { throw new Error('O Apps Script não retornou dados (verifique a implantação e o acesso "Qualquer pessoa").'); }
    if (!d.ok) throw new Error('Erro no Apps Script: ' + (d.error || 'desconhecido'));
    confirmations = d.confirmacoes || [];
    if (Array.isArray(d.convidados) && d.convidados.length) rawGuests = d.convidados;
  } catch(e) {
    confirmations = [];
    loadError = e.name === 'AbortError'
      ? 'A planilha demorou demais para responder. Toque em atualizar.'
      : (e.message || 'Não foi possível conectar à planilha.');
  }

  try {
    guests = rawGuests ? buildGuests(rawGuests) : await fetchGuestsCSV();
  } catch(e) {
    guests = [];
  }

  // Liga cada convidado à sua resposta
  guests.forEach(g => {
    const c = confirmations.find(x => norm(x.name) === norm(g.name));
    g.conf = c || null;
    g.status = !c ? 'aguardando' : (c.resp === 'Confirmado' ? 'confirmado' : 'nao');
  });
}

/* ---------- CÁLCULOS ---------- */
function confTotal(c) {
  const t = parseInt(c.total);
  if (!isNaN(t)) return t;
  return (parseInt(c.adults) || 0) + (parseInt(c.children) || 0) || 1;
}
function confChildren(c) { return parseInt(c.children) || 0; }
function confAdults(c) {
  const a = parseInt(c.adults);
  return isNaN(a) ? confTotal(c) - confChildren(c) : a;
}

function stats() {
  const sim = confirmations.filter(c => c.resp === 'Confirmado');
  const nao = confirmations.filter(c => c.resp !== 'Confirmado');
  const aguardando = guests.filter(g => g.status === 'aguardando').length;
  const pessoas = sim.reduce((a, c) => a + confTotal(c), 0);
  const adultos = sim.reduce((a, c) => a + confAdults(c), 0);
  const criancas = sim.reduce((a, c) => a + confChildren(c), 0);
  const previstas = guests.reduce((a, g) => a + 1 + g.companions.length, 0);
  return { total: guests.length, sim: sim.length, nao: nao.length, aguardando, pessoas, adultos, criancas, previstas };
}

// "Ana, João (5 anos)" → [{name:'Ana'}, {name:'João', age:'5 anos', child:true}]
function splitCompanions(str) {
  return String(str || '').split(/\s*,\s*/).filter(Boolean).map(p => {
    const m = p.match(/^(.*?)\s*\(([^)]*anos?)\)\s*$/i);
    return m ? { name: m[1], age: m[2], child: true } : { name: p };
  });
}
const initial = n => (String(n || '?').trim()[0] || '?').toUpperCase();

/* ---------- RENDER ---------- */
function tagFor(status) {
  if (status === 'confirmado') return '<span class="tag tag-green">Confirmado</span>';
  if (status === 'nao') return '<span class="tag tag-rose">Não virá</span>';
  return '<span class="tag tag-muted">Aguardando</span>';
}

function renderAlert() {
  $('alert-box').innerHTML = loadError ? `<div class="alert">⚠ ${esc(loadError)}</div>` : '';
}

function renderResumo() {
  const s = stats();
  const resp = s.sim + s.nao;
  const pctSim = s.total ? (s.sim / s.total) * 100 : 0;
  const pctNao = s.total ? (s.nao / s.total) * 100 : 0;

  const confirmados = confirmations
    .filter(c => c.resp === 'Confirmado')
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));

  $('view-resumo').innerHTML = `
    <div class="hero">
      <div class="hero-num">${s.pessoas}</div>
      <div class="hero-lbl">Pessoas confirmadas</div>
      <div class="hero-split">
        <div><b>${s.adultos}</b><span>Adultos</span></div>
        <div><b>${s.criancas}</b><span>Crianças</span></div>
      </div>
    </div>

    <div class="grid">
      <div class="stat green" data-goto="confirmado"><b>${s.sim}</b><span>Confirmados</span></div>
      <div class="stat red" data-goto="nao"><b>${s.nao}</b><span>Não virão</span></div>
      <div class="stat amber" data-goto="aguardando"><b>${s.aguardando}</b><span>Aguardando</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-top"><span>Respostas recebidas</span><b>${resp} de ${s.total}</b></div>
      <div class="bar"><i class="g" style="width:${pctSim}%"></i><i class="r" style="width:${pctNao}%"></i></div>
      <div class="legend">
        <span style="--c:#8fc095">Confirmados</span>
        <span style="--c:#DBA9B7">Não virão</span>
        <span style="--c:#f3e9db">Aguardando</span>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-top"><span>Convites (titulares)</span><b>${s.total}</b></div>
      <div class="progress-top" style="margin-bottom:0"><span>Pessoas previstas na lista</span><b>${s.previstas}</b></div>
    </div>

    <h2 class="section-title">Titulares <em>confirmados</em> · ${confirmados.length}</h2>
    ${confirmados.length ? `<div class="conf-list">${confirmados.map(c => {
      const comps = splitCompanions(c.companions);
      const sub = comps.length ? 'Com ' + comps.map(x => x.name).join(', ') : 'Sem acompanhantes';
      const n = confTotal(c);
      return `<div class="conf-row">
        <div class="avatar">${esc(initial(c.name))}</div>
        <div class="conf-row-main">
          <div class="conf-row-name">${esc(c.name)}</div>
          <div class="conf-row-sub">${esc(sub)}</div>
        </div>
        <div class="conf-row-count"><b>${n}</b><span>${n === 1 ? 'pessoa' : 'pessoas'}</span></div>
      </div>`;
    }).join('')}</div>` : '<div class="card"><div class="empty" style="padding:1.5rem 0">Nenhuma confirmação ainda.</div></div>'}
  `;

  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => {
    guestFilter = el.dataset.goto;
    showView('convidados');
  }));
}

function renderGuests() {
  const counts = {
    todos: guests.length,
    confirmado: guests.filter(g => g.status === 'confirmado').length,
    nao: guests.filter(g => g.status === 'nao').length,
    aguardando: guests.filter(g => g.status === 'aguardando').length
  };
  const labels = { todos: 'Todos', confirmado: 'Confirmados', nao: 'Não virão', aguardando: 'Aguardando' };
  $('chips-guests').innerHTML = Object.keys(labels).map(k =>
    `<button class="chip ${guestFilter === k ? 'active' : ''}" data-f="${k}">${labels[k]}<small>${counts[k]}</small></button>`
  ).join('');
  $('chips-guests').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { guestFilter = b.dataset.f; renderGuests(); }));

  const q = norm($('search-guests').value);
  const list = guests
    .filter(g => guestFilter === 'todos' || g.status === guestFilter)
    .filter(g => !q || norm(g.name).includes(q) || g.companions.some(c => norm(c.name).includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

  $('count-guests').textContent = `${list.length} convite${list.length === 1 ? '' : 's'}`;

  if (!guests.length) { $('list-guests').innerHTML = '<div class="empty">Nenhum convidado encontrado na planilha.</div>'; return; }
  if (!list.length) { $('list-guests').innerHTML = '<div class="empty">Nenhum resultado.</div>'; return; }

  $('list-guests').innerHTML = list.map(g => {
    const comp = g.companions.length
      ? g.companions.map(c => esc(c.name) + (c.child ? ' <i style="opacity:.7">(criança)</i>' : '')).join(', ')
      : 'Sem acompanhantes';
    const nums = g.status === 'confirmado'
      ? `<div class="card-nums"><span>Total <b>${confTotal(g.conf)}</b></span><span>Adultos <b>${confAdults(g.conf)}</b></span><span>Crianças <b>${confChildren(g.conf)}</b></span></div>`
      : '';
    return `<div class="card">
      <div class="card-top"><div class="card-name">${esc(g.name)}</div>${tagFor(g.status)}</div>
      <div class="card-meta">${comp}</div>
      ${nums}
    </div>`;
  }).join('');
}

function renderConfirmations() {
  const counts = {
    todos: confirmations.length,
    confirmado: confirmations.filter(c => c.resp === 'Confirmado').length,
    nao: confirmations.filter(c => c.resp !== 'Confirmado').length
  };
  const labels = { confirmado: 'Vão', nao: 'Não vão', todos: 'Todas' };
  $('chips-conf').innerHTML = Object.keys(labels).map(k =>
    `<button class="${confFilter === k ? 'active' : ''}" data-f="${k}">${labels[k]}<b>${counts[k]}</b></button>`
  ).join('');
  $('chips-conf').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { confFilter = b.dataset.f; renderConfirmations(); }));

  const q = norm($('search-conf').value);
  const list = [...confirmations].reverse()
    .filter(c => confFilter === 'todos' || (confFilter === 'confirmado' ? c.resp === 'Confirmado' : c.resp !== 'Confirmado'))
    .filter(c => !q || norm(c.name).includes(q) || norm(c.companions).includes(q));

  if (confFilter === 'confirmado') {
    const pessoas = list.reduce((a, c) => a + confTotal(c), 0);
    $('count-conf').textContent = `${list.length} titular${list.length === 1 ? '' : 'es'} · ${pessoas} pessoa${pessoas === 1 ? '' : 's'}`;
  } else {
    $('count-conf').textContent = `${list.length} resposta${list.length === 1 ? '' : 's'} · mais recentes primeiro`;
  }

  if (!confirmations.length) { $('list-conf').innerHTML = '<div class="empty">Nenhuma resposta recebida ainda.</div>'; return; }
  if (!list.length) { $('list-conf').innerHTML = '<div class="empty">Nenhum resultado.</div>'; return; }

  $('list-conf').innerHTML = list.map(c => {
    const ok = c.resp === 'Confirmado';
    if (!ok) {
      return `<div class="resp-card no">
        <div class="resp-head">
          <div class="avatar no">${esc(initial(c.name))}</div>
          <div class="resp-head-main">
            <div class="resp-name">${esc(c.name)}</div>
            <div class="resp-date">${esc(c.date || '')}</div>
          </div>
          <span class="tag tag-rose">Não vai</span>
        </div>
      </div>`;
    }
    const n = confTotal(c), ad = confAdults(c), cr = confChildren(c);
    const comps = splitCompanions(c.companions);
    const pills = [`<span class="pill titular">${esc(c.name.split(' ')[0])}</span>`]
      .concat(comps.map(x => x.child
        ? `<span class="pill child">${esc(x.name)} · ${esc(x.age)}</span>`
        : `<span class="pill">${esc(x.name)}</span>`))
      .join('');
    return `<div class="resp-card">
      <div class="resp-head">
        <div class="avatar">${esc(initial(c.name))}</div>
        <div class="resp-head-main">
          <div class="resp-name">${esc(c.name)}</div>
          <div class="resp-date">Confirmou em ${esc(c.date || '—')}</div>
        </div>
        <div class="resp-badge"><b>${n}</b><span>${n === 1 ? 'pessoa' : 'pessoas'}</span></div>
      </div>
      <div class="resp-body">
        <div class="resp-split"><b>${ad}</b> adulto${ad === 1 ? '' : 's'} · <b>${cr}</b> criança${cr === 1 ? '' : 's'}</div>
        ${comps.length ? `<div class="pills">${pills}</div>` : '<div class="resp-alone">Vem sem acompanhantes</div>'}
      </div>
    </div>`;
  }).join('');
}

function renderAll() {
  renderAlert();
  renderResumo();
  renderGuests();
  renderConfirmations();
  const now = new Date();
  $('last-update').textContent = 'Atualizado às ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  $('btn-refresh').classList.add('spin');
  $('last-update').textContent = 'Atualizando…';
  await loadData();
  renderAll();
  $('btn-refresh').classList.remove('spin');
  refreshing = false;
}

/* ---------- NAVEGAÇÃO ---------- */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (name === 'convidados') renderGuests();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

$('btn-refresh').addEventListener('click', refresh);
$('search-guests').addEventListener('input', renderGuests);
$('search-conf').addEventListener('input', renderConfirmations);

// Atualiza sozinho ao voltar para o app
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

/* ---------- EXPORTAR ---------- */
$('btn-export').addEventListener('click', () => {
  if (!confirmations.length) return;
  const rows = [['Nome', 'Resposta', 'Total', 'Adultos', 'Crianças', 'Acompanhantes', 'Data']];
  confirmations.forEach(c => {
    const ok = c.resp === 'Confirmado';
    rows.push([c.name, c.resp, ok ? confTotal(c) : 0, ok ? confAdults(c) : 0, ok ? confChildren(c) : 0, c.companions || '', c.date || '']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'confirmacoes-mariana.csv';
  a.click();
});

/* ---------- INÍCIO ---------- */
refresh();
</script>
</body>
</html>
